services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg2://kanha:kanha@db:5432/kanha_erp
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kanha
      POSTGRES_PASSWORD: kanha
      POSTGRES_DB: kanha_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
